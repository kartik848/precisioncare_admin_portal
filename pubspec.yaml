name: precisioncare_admin_portal
description: "PrecisionCare Diagnostic Centre - Web Admin Operations Portal (Flutter Web)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  google_fonts: ^6.3.0
  pdf: ^3.11.3
  printing: ^5.14.3
  shared_preferences: ^2.5.3
  http: ^1.2.0
  image_picker: ^1.1.2
  file_picker: 8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/3d/
